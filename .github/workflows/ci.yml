name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on the committed synthetic fixture and the committed escape_v1 circuit
# artifact. Nothing downloads the MaleCNS dataset (data/raw is git-ignored and untouched).
# No FLYBRAIN_* variables are set: the suites exercise the defaults a developer gets locally.
jobs:
  backend:
    name: backend (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e "backend[dev]"
      - name: ruff check + format
        working-directory: backend
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts
      - name: pytest (fixture + committed escape_v1 artifact; no dataset download)
        working-directory: backend
        run: python -m pytest -q
      - name: Smoke scripts (health, fixture data/circuit/simulation, escape demo, web demo API, embodiment, threat lab, intervention)
        run: |
          python scripts/smoke_test.py
          python scripts/inspect_dataset.py --fixture --keep-dangling
          python scripts/inspect_dataset.py --allow-missing
          python scripts/smoke_circuit.py
          python scripts/smoke_simulation.py
          python scripts/smoke_escape.py
          python scripts/smoke_web_demo.py
          python scripts/smoke_embodiment.py
          python scripts/smoke_threat_lab.py
          python scripts/smoke_intervention.py

  frontend:
    name: frontend (node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  e2e:
    name: playwright (live backend, committed escape_v1 artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e "backend[dev]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Startup validation (scripts/run_demo.py --check)
        run: python scripts/run_demo.py --check
      - name: Startup smoke (start backend + frontend, verify, stop)
        run: python scripts/run_demo.py --smoke --backend-port 8010 --frontend-port 5183
      - name: Playwright (health smoke, P5 demo, P6 inspector, landing, screenshots)
        working-directory: frontend
        env:
          CI: "true"
          FLYBRAIN_PYTHON: python
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
